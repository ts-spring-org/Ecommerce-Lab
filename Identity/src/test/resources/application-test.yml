spring:
  jpa:
    hibernate:
      ddl-auto: validate
  liquibase:
    enabled: true
identity:
  security:
    jwt:
      issuer: http://localhost:8081
      audience: ecommerce-api
      access-token-ttl: PT15M
      private-key: 
      public-key: 
    refresh-token:
      ttl: P30D
    web:
      allowed-origins: http://localhost:3000
      cookie-secure: false
      cookie-same-site: Lax
  email-verification:
    frontend-base-url: http://localhost:3000
  rate-limit:
    enabled: false
  outbox:
    enabled: false
