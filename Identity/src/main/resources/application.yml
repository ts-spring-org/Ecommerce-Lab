spring:
  application:
    name: identity-service
  datasource:
    url: ${IDENTITY_DB_URL}
    username: ${IDENTITY_DB_USERNAME}
    password: ${IDENTITY_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:false}
server:
  port: 8081
  forward-headers-strategy: framework
identity:
  outbox:
    enabled: ${IDENTITY_OUTBOX_ENABLED:true}
    poll-interval: ${IDENTITY_OUTBOX_POLL_INTERVAL:5000}
  email-verification:
    frontend-base-url: ${IDENTITY_FRONTEND_BASE_URL:http://localhost:3000}
  security:
    jwt:
      issuer: ${IDENTITY_JWT_ISSUER:http://localhost:8081}
      audience: ${IDENTITY_JWT_AUDIENCE:ecommerce-api}
      access-token-ttl: ${IDENTITY_ACCESS_TOKEN_TTL:PT15M}
      private-key: ${IDENTITY_JWT_PRIVATE_KEY:}
      public-key: ${IDENTITY_JWT_PUBLIC_KEY:}
    refresh-token:
      ttl: ${IDENTITY_REFRESH_TOKEN_TTL:P30D}
    web:
      allowed-origins: ${IDENTITY_WEB_ALLOWED_ORIGINS:http://localhost:3000}
      cookie-secure: ${IDENTITY_COOKIE_SECURE:true}
      cookie-same-site: ${IDENTITY_COOKIE_SAME_SITE:Lax}
management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      show-details: never
